services:
  ledger:
    image: postgres:16-alpine
    container_name: celesto_ledger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celesto_run_ledger_api
    restart: unless-stopped
    depends_on:
      ledger:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ledger:ledger@ledger:5432/ledger
      API_PORT: 8080
      CELESTO_PROVIDER: cloud
      CELESTO_API_KEY: replace-me
      CELESTO_BACKEND: firecracker
      LLM_BASE_URL: https://example-llm-host/v1
      LLM_API_KEY: replace-me
      LLM_MODEL: replace-with-a-model-name
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
